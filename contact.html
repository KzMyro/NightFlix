<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contactez l'equipe NightFlix pour partager vos idees cinema.">
  <title>NightFlix | Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body data-page="contact">
  <header class="site-header" data-header>
    <a class="logo" href="index.html">Night<span>Flix</span></a>
    <button class="menu-toggle" data-menu-toggle aria-label="Ouvrir le menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav-links" data-nav>
      <a href="index.html">Accueil</a>
      <a href="films.html">Films</a>
      <a href="tendances.html">Top tendances</a>
      <a href="quiz.html">Quiz</a>
      <a href="maliste.html">Ma Liste <span class="nav-count" data-nav-list-count>0</span></a>
      <a class="active" href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="contact-layout">
    <section class="contact-intro reveal">
      <p class="eyebrow">Contact</p>
      <h1>Une question pour NightFlix ?</h1>
      <p>Une suggestion de film ? Une question ? Contactez l'equipe NightFlix et partagez votre univers cinema avec nous.</p>
      <div class="socials" aria-label="Reseaux sociaux">
        <button class="discord" type="button" aria-label="Discord"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 5.3A15.8 15.8 0 0 0 15.6 4l-.2.4c1.4.4 2.1 1 2.1 1s-1.8-1-5.4-1-5.4 1-5.4 1 .7-.6 2.1-1L8.6 4a15.8 15.8 0 0 0-3.9 1.3C2.2 9 1.5 12.6 1.8 16.1c1.6 1.2 3.2 1.9 4.8 2.4l1-1.7c-.6-.2-1.1-.5-1.6-.8l.4-.3c3.1 1.4 6.4 1.4 9.4 0l.4.3c-.5.3-1 .6-1.6.8l1 1.7c1.6-.5 3.2-1.2 4.8-2.4.4-4.1-.7-7.6-2.9-10.8ZM8.6 14.2c-.9 0-1.6-.8-1.6-1.8s.7-1.8 1.6-1.8 1.6.8 1.6 1.8-.7 1.8-1.6 1.8Zm6.8 0c-.9 0-1.6-.8-1.6-1.8s.7-1.8 1.6-1.8 1.6.8 1.6 1.8-.7 1.8-1.6 1.8Z"/></svg></span>Discord</button>
        <button class="instagram" type="button" aria-label="Instagram"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2Zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm5.3-2.5a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4Z"/></svg></span>Instagram</button>
        <button class="youtube" type="button" aria-label="YouTube"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 7.2s-.2-1.5-.8-2.1c-.8-.8-1.7-.8-2.1-.9C15.8 4 12 4 12 4s-3.8 0-6.7.2c-.4.1-1.3.1-2.1.9-.6.6-.8 2.1-.8 2.1S2.2 9 2.2 10.8v1.7c0 1.8.2 3.6.2 3.6s.2 1.5.8 2.1c.8.8 1.9.8 2.4.9 1.7.2 6.4.2 6.4.2s3.8 0 6.7-.2c.4-.1 1.3-.1 2.1-.9.6-.6.8-2.1.8-2.1s.2-1.8.2-3.6v-1.7c0-1.8-.2-3.6-.2-3.6ZM10 15.2V8.8l5.8 3.2-5.8 3.2Z"/></svg></span>YouTube</button>
        <button class="tiktok" type="button" aria-label="TikTok"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 3c.5 2.9 2.1 4.6 4.8 4.8v3.3c-1.8.1-3.4-.5-4.7-1.5v6.2c0 3.1-2.1 5.2-5.2 5.2-2.9 0-5.1-2.1-5.1-4.9 0-3 2.4-5.1 5.5-4.8v3.4c-1.4-.4-2.3.3-2.3 1.4 0 .9.7 1.6 1.8 1.6 1.2 0 1.9-.7 1.9-2.1V3h3.3Z"/></svg></span>TikTok</button>
      </div>
    </section>

    <section class="contact-card reveal">
      <form data-contact-form novalidate>
        <label>
          Nom
          <input type="text" name="name" placeholder="Votre nom">
          <small data-error-for="name"></small>
        </label>
        <label>
          Email
          <input type="email" name="email" placeholder="exemple@mail.com">
          <small data-error-for="email"></small>
        </label>
        <label>
          Sujet
          <input type="text" name="subject" placeholder="Sujet du message">
          <small data-error-for="subject"></small>
        </label>
        <label>
          Message
          <textarea name="message" rows="5" placeholder="Votre message"></textarea>
          <small data-error-for="message"></small>
        </label>
        <button class="btn primary full" type="submit">Envoyer</button>
        <p class="form-success" data-form-success hidden></p>
      </form>
    </section>
  </main>

  <footer class="footer">
    <strong>NightFlix</strong>
    <p>NightFlix - Votre portail vers les films les plus marquants.</p>
  </footer>
  <button class="back-top" data-back-top aria-label="Retour en haut">&#8593;</button>
</body>
</html>
